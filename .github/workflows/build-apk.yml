name: Build Kayan AI Keyboard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 سحب الملفات (Checkout)
        uses: actions/checkout@v4

      - name: 🛠️ توليد ملفات مشروع الأندرويد تلقائياً
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: ☕ إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 إعداد محرك Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 🚀 بناء ملف الـ APK (Assemble Debug)
        run: gradle assembleDebug --no-daemon

      - name: 📦 رفع ملف الـ APK جاهز للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Kayan-AI-Keyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
